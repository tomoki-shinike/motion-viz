<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>環境チェック — モーションビジュアライザー</title>
<style>
  :root{
    --ink:#12181b;
    --ink-2:#55646b;
    --line:#d3dade;
    --paper:#f6f8f8;
    --card:#ffffff;
    --ok:#1d6f4f;
    --warn:#8a5b00;
    --ng:#a32b21;
    --probe:#1f5f8b;
  }
  *{box-sizing:border-box;-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:16px;
    line-height:1.6;
    padding:0 16px calc(96px + env(safe-area-inset-bottom));
    max-width:720px;
    margin:0 auto;
  }
  .masthead{
    padding:24px 0 16px;
    border-bottom:2px solid var(--ink);
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:12px;
  }
  .masthead h1{
    font-size:18px;
    font-weight:600;
    letter-spacing:.01em;
    margin:0;
  }
  .masthead .ver{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;
    color:var(--ink-2);
    white-space:nowrap;
  }
  .lede{
    margin:16px 0 24px;
    font-size:14px;
    color:var(--ink-2);
  }

  h2{
    font-size:14px;
    font-weight:600;
    margin:32px 0 8px;
    padding-bottom:6px;
    border-bottom:1px solid var(--line);
  }

  /* 読み取り行 */
  .row{
    display:grid;
    grid-template-columns:1fr auto;
    gap:4px 12px;
    align-items:baseline;
    padding:9px 0;
    border-bottom:1px solid var(--line);
  }
  .row .k{font-size:14px}
  .row .v{
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:13px;
    text-align:right;
    color:var(--ink-2);
    word-break:break-all;
  }
  .row .note{
    grid-column:1/-1;
    font-size:12px;
    color:var(--ink-2);
    margin-top:2px;
  }
  .v.ok{color:var(--ok)}
  .v.warn{color:var(--warn)}
  .v.ng{color:var(--ng)}
  .v.probe{color:var(--probe)}

  .btn{
    display:block;
    width:100%;
    padding:14px 16px;
    margin:12px 0 0;
    background:var(--ink);
    color:#fff;
    border:none;
    border-radius:2px;
    font-size:15px;
    font-family:inherit;
    font-weight:500;
    cursor:pointer;
  }
  .btn.quiet{
    background:transparent;
    color:var(--ink);
    border:1px solid var(--ink);
  }
  .btn:disabled{opacity:.4}
  .btn:focus-visible{outline:2px solid var(--probe);outline-offset:2px}

  label.file{
    display:block;
    padding:14px 16px;
    margin-top:12px;
    border:1px dashed var(--ink-2);
    border-radius:2px;
    text-align:center;
    font-size:15px;
    font-weight:500;
    cursor:pointer;
  }
  label.file input{display:none}

  video,canvas.preview{
    width:100%;
    max-height:220px;
    background:#000;
    display:block;
    margin-top:12px;
    object-fit:contain;
  }
  .hidden{display:none}

  #logwrap{
    position:fixed;
    left:0;right:0;bottom:0;
    background:var(--card);
    border-top:2px solid var(--ink);
    max-height:60vh;
    display:flex;
    flex-direction:column;
    padding-bottom:env(safe-area-inset-bottom);
  }
  #logbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 16px;
    cursor:pointer;
  }
  #logbar span{font-size:13px;font-weight:600;flex:1}
  #logbar button{
    font-family:inherit;
    font-size:12px;
    padding:6px 10px;
    border:1px solid var(--line);
    background:var(--card);
    border-radius:2px;
    cursor:pointer;
  }
  #log{
    display:none;
    overflow-y:auto;
    padding:0 16px 16px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:11px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-all;
    color:var(--ink-2);
    border-top:1px solid var(--line);
  }
  #log.open{display:block}
  #log .err{color:var(--ng)}
</style>
</head>
<body>

<div class="masthead">
  <h1>環境チェック</h1>
  <div class="ver" id="ver">v0.1</div>
</div>

<p class="lede">
  この端末で姿勢解析アプリが動くかを確認します。結果のスクリーンショットを撮って共有してください。
</p>

<h2>端末</h2>
<div id="device"></div>

<h2>描画と保存</h2>
<div id="basic"></div>
<button class="btn" id="runBasic">チェックを実行</button>

<h2>動画の読み込みと再生速度</h2>
<p class="lede" style="margin:8px 0 0">
  写真アプリから動画を1本選んでください。5〜10秒程度の、人が全身で写っているものが理想です。
</p>
<label class="file">
  動画を選ぶ
  <input type="file" accept="video/*" id="videoInput">
</label>
<video id="video" playsinline muted class="hidden"></video>
<div id="videoRes"></div>

<h2>姿勢推定の速度</h2>
<p class="lede" style="margin:8px 0 0">
  骨格検出を実際に動かして、1フレームあたりの処理時間を測ります。開発中のため外部から解析エンジンを読み込みます。院内で使う版ではすべて内部に持ちます。
</p>
<button class="btn quiet" id="runPose" disabled>姿勢推定を試す</button>
<canvas id="poseCanvas" class="preview hidden"></canvas>
<div id="poseRes"></div>

<div id="logwrap">
  <div id="logbar">
    <span id="logTitle">ログ (0)</span>
    <button id="copyLog" type="button">コピー</button>
    <button id="toggleLog" type="button">開く</button>
  </div>
  <div id="log"></div>
</div>

<script>
const VERSION = "v0.1";
document.getElementById('ver').textContent = VERSION;

/* ---------- ログ ---------- */
const logEl = document.getElementById('log');
const logTitle = document.getElementById('logTitle');
let logLines = [];
function log(msg, isErr){
  const t = new Date().toISOString().slice(11,23);
  const line = `[${t}] ${msg}`;
  logLines.push(line);
  const d = document.createElement('div');
  if(isErr) d.className = 'err';
  d.textContent = line;
  logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  logTitle.textContent = `ログ (${logLines.length})`;
}
window.addEventListener('error', e => log('ERROR: ' + e.message + ' @' + e.filename + ':' + e.lineno, true));
window.addEventListener('unhandledrejection', e => log('REJECT: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)), true));
document.getElementById('toggleLog').addEventListener('click', e => {
  e.stopPropagation();
  const open = logEl.classList.toggle('open');
  e.target.textContent = open ? '閉じる' : '開く';
});
document.getElementById('copyLog').addEventListener('click', async e => {
  e.stopPropagation();
  const text = [`--- ${VERSION} / ${new Date().toISOString()} ---`, ...logLines].join('\n');
  try{
    await navigator.clipboard.writeText(text);
    e.target.textContent = 'コピーしました';
  }catch(err){
    e.target.textContent = 'コピー不可';
    log('clipboard: ' + err.message, true);
  }
  setTimeout(()=>{ e.target.textContent='コピー'; }, 1800);
});

/* ---------- 結果行 ---------- */
function addRow(container, key, value, state, note){
  const el = typeof container === 'string' ? document.getElementById(container) : container;
  const row = document.createElement('div');
  row.className = 'row';
  const k = document.createElement('div');
  k.className = 'k'; k.textContent = key;
  const v = document.createElement('div');
  v.className = 'v' + (state ? ' ' + state : ''); v.textContent = value;
  row.append(k, v);
  if(note){
    const n = document.createElement('div');
    n.className = 'note'; n.textContent = note;
    row.append(n);
  }
  el.appendChild(row);
  log(`${key}: ${value}${note ? ' / ' + note : ''}`);
  return row;
}
function clear(id){ document.getElementById(id).innerHTML = ''; }

/* ---------- 端末情報 ---------- */
(function device(){
  const ua = navigator.userAgent;
  addRow('device', 'ブラウザ判定', /CriOS/.test(ua) ? 'Chrome (iOS)' : /FxiOS/.test(ua) ? 'Firefox (iOS)' : /Safari/.test(ua) && /Version/.test(ua) ? 'Safari' : 'その他');
  const m = ua.match(/OS (\d+[_\d]*) like Mac/);
  addRow('device', 'OS', m ? 'iOS ' + m[1].replace(/_/g,'.') : (navigator.platform || '不明'));
  addRow('device', '画面', `${window.screen.width}×${window.screen.height} @${window.devicePixelRatio}x`);
  addRow('device', 'CPUコア数', navigator.hardwareConcurrency ? String(navigator.hardwareConcurrency) : '非公開');
  addRow('device', 'ホーム画面から起動', window.navigator.standalone ? 'はい' : 'いいえ', null,
    window.navigator.standalone ? null : 'Safariのタブで表示中');
  addRow('device', 'UA', ua);
})();

/* ---------- 基本チェック ---------- */
document.getElementById('runBasic').addEventListener('click', async () => {
  clear('basic');
  const btn = document.getElementById('runBasic');
  btn.disabled = true; btn.textContent = '確認中…';

  // WebGL
  try{
    const c = document.createElement('canvas');
    const gl2 = c.getContext('webgl2');
    const gl = gl2 || c.getContext('webgl');
    if(gl){
      let renderer = '不明';
      try{
        const dbg = gl.getExtension('WEBGL_debug_renderer_info');
        if(dbg) renderer = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
        else renderer = gl.getParameter(gl.RENDERER);
      }catch(e){}
      addRow('basic', 'WebGL', gl2 ? 'WebGL2 対応' : 'WebGL1 のみ', gl2 ? 'ok' : 'warn', String(renderer));
    } else {
      addRow('basic', 'WebGL', '非対応', 'ng', '姿勢推定がCPU実行になり大幅に遅くなります');
    }
  }catch(e){ addRow('basic','WebGL','判定失敗','ng', e.message); }

  // フレーム取り出し
  addRow('basic', 'フレーム単位の取り出し',
    'requestVideoFrameCallback' in HTMLVideoElement.prototype ? '対応' : '非対応',
    'requestVideoFrameCallback' in HTMLVideoElement.prototype ? 'ok' : 'warn',
    'requestVideoFrameCallback' in HTMLVideoElement.prototype ? null : 'フレーム抜けが起きやすくなります');

  addRow('basic', 'OffscreenCanvas', typeof OffscreenCanvas !== 'undefined' ? '対応' : '非対応',
    typeof OffscreenCanvas !== 'undefined' ? 'ok' : 'warn');

  // 動画書き出し(MediaRecorder)
  try{
    if(typeof MediaRecorder === 'undefined'){
      addRow('basic', '動画書き出し (録画方式)', '非対応', 'ng', '骨格動画の生成に別方式が必要です');
    }else{
      const types = ['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
      const okTypes = types.filter(t => { try{ return MediaRecorder.isTypeSupported(t); }catch(e){ return false; } });
      addRow('basic', '動画書き出し (録画方式)', okTypes.length ? '対応' : '対応形式なし',
        okTypes.length ? 'ok' : 'ng', okTypes.length ? okTypes.join(' / ') : null);
    }
  }catch(e){ addRow('basic','動画書き出し (録画方式)','判定失敗','ng', e.message); }

  addRow('basic', 'canvasからの録画', typeof HTMLCanvasElement !== 'undefined' && 'captureStream' in HTMLCanvasElement.prototype ? '対応' : '非対応',
    'captureStream' in HTMLCanvasElement.prototype ? 'ok' : 'warn');

  // WebCodecs
  try{
    if(typeof VideoEncoder === 'undefined'){
      addRow('basic', '動画書き出し (高速方式)', '非対応', 'warn', '録画方式で代替します');
    }else{
      const cfg = {codec:'avc1.42001E', width:640, height:480, bitrate:2_000_000, framerate:30};
      const r = await VideoEncoder.isConfigSupported(cfg);
      addRow('basic', '動画書き出し (高速方式)', r && r.supported ? '対応' : '設定が非対応',
        r && r.supported ? 'ok' : 'warn', 'H.264 640×480');
    }
  }catch(e){ addRow('basic','動画書き出し (高速方式)','判定失敗','warn', e.message); }

  // ストレージ
  try{
    if(navigator.storage && navigator.storage.estimate){
      const est = await navigator.storage.estimate();
      const q = est.quota ? (est.quota/1048576).toFixed(0) : '?';
      const u = est.usage ? (est.usage/1048576).toFixed(1) : '0';
      addRow('basic', 'アプリが使える保存領域', `${q} MB`, 'probe', `使用中 ${u} MB`);
    }else{
      addRow('basic', 'アプリが使える保存領域', '取得不可', 'warn');
    }
  }catch(e){ addRow('basic','アプリが使える保存領域','判定失敗','warn', e.message); }

  // 保存領域の永続化
  try{
    if(navigator.storage && navigator.storage.persisted){
      const p = await navigator.storage.persisted();
      addRow('basic', '保存領域の保護', p ? '有効' : '無効', p ? 'ok' : 'warn',
        p ? null : 'OSに削除される可能性があります。履歴の定期書き出しが必要です');
    }else{
      addRow('basic', '保存領域の保護', '確認不可', 'warn', '履歴の定期書き出しを前提にします');
    }
  }catch(e){ addRow('basic','保存領域の保護','判定失敗','warn', e.message); }

  // IndexedDB 実書き込み
  await new Promise(res => {
    try{
      const req = indexedDB.open('mv_check', 1);
      req.onupgradeneeded = () => req.result.createObjectStore('t');
      req.onerror = () => { addRow('basic','履歴データベース','開けません','ng', String(req.error)); res(); };
      req.onsuccess = () => {
        const db = req.result;
        try{
          const tx = db.transaction('t','readwrite');
          tx.objectStore('t').put({at: Date.now(), pad: 'x'.repeat(2048)}, 'probe');
          tx.oncomplete = () => {
            const tx2 = db.transaction('t','readonly');
            const g = tx2.objectStore('t').get('probe');
            g.onsuccess = () => {
              addRow('basic','履歴データベース', g.result ? '読み書きOK' : '読み出し失敗', g.result ? 'ok' : 'ng');
              db.close(); res();
            };
            g.onerror = () => { addRow('basic','履歴データベース','読み出し失敗','ng'); db.close(); res(); };
          };
          tx.onerror = () => { addRow('basic','履歴データベース','書き込み失敗','ng', String(tx.error)); db.close(); res(); };
        }catch(e){ addRow('basic','履歴データベース','失敗','ng', e.message); res(); }
      };
    }catch(e){ addRow('basic','履歴データベース','失敗','ng', e.message); res(); }
  });

  btn.textContent = 'もう一度チェックする';
  btn.disabled = false;
});

/* ---------- 動画テスト ---------- */
const video = document.getElementById('video');
let videoReady = false;

document.getElementById('videoInput').addEventListener('change', async (e) => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  clear('videoRes');
  videoReady = false;
  document.getElementById('runPose').disabled = true;

  addRow('videoRes', 'ファイル', f.name || '(名前なし)', 'probe',
    `${(f.size/1048576).toFixed(1)} MB / ${f.type || '形式不明'}`);

  const url = URL.createObjectURL(f);
  video.src = url;
  video.classList.remove('hidden');

  try{
    await new Promise((res, rej) => {
      video.onloadedmetadata = res;
      video.onerror = () => rej(new Error('この動画を読み込めません'));
      setTimeout(()=>rej(new Error('読み込みがタイムアウトしました')), 15000);
    });
  }catch(err){
    addRow('videoRes','読み込み','失敗','ng', err.message);
    log('video load failed: ' + err.message, true);
    return;
  }

  addRow('videoRes','解像度', `${video.videoWidth}×${video.videoHeight}`, 'probe');
  addRow('videoRes','長さ', `${video.duration.toFixed(1)} 秒`, 'probe');

  // 再生しながらフレーム数を数えて実効fpsを測る
  addRow('videoRes','再生速度の測定','測定中…','probe');
  const measuringRow = document.getElementById('videoRes').lastChild;
  try{
    const fps = await measureFps(video);
    measuringRow.querySelector('.v').textContent = `${fps.toFixed(1)} fps`;
    measuringRow.querySelector('.v').className = 'v ' + (fps >= 24 ? 'ok' : fps >= 12 ? 'warn' : 'ng');
    log(`decode fps = ${fps.toFixed(2)}`);
  }catch(err){
    measuringRow.querySelector('.v').textContent = '測定できず';
    measuringRow.querySelector('.v').className = 'v warn';
    log('fps measure failed: ' + err.message, true);
  }

  videoReady = true;
  document.getElementById('runPose').disabled = false;
});

async function measureFps(v){
  const hasRvfc = 'requestVideoFrameCallback' in HTMLVideoElement.prototype;
  v.currentTime = 0;
  try{ await v.play(); }catch(e){ throw new Error('再生を開始できません: ' + e.message); }
  const t0 = performance.now();
  let frames = 0;
  await new Promise(res => {
    const DURATION = 2500;
    if(hasRvfc){
      const step = () => {
        frames++;
        if(performance.now() - t0 < DURATION && !v.ended) v.requestVideoFrameCallback(step);
        else res();
      };
      v.requestVideoFrameCallback(step);
    }else{
      let last = -1;
      const tick = () => {
        if(v.currentTime !== last){ frames++; last = v.currentTime; }
        if(performance.now() - t0 < DURATION && !v.ended) requestAnimationFrame(tick);
        else res();
      };
      requestAnimationFrame(tick);
    }
    setTimeout(res, DURATION + 1500);
  });
  v.pause();
  const el = (performance.now() - t0) / 1000;
  return frames / el;
}

/* ---------- 姿勢推定テスト ---------- */
const CDN = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
const MODEL = 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task';

document.getElementById('runPose').addEventListener('click', async () => {
  const btn = document.getElementById('runPose');
  btn.disabled = true; btn.textContent = '準備中…';
  clear('poseRes');

  if(!videoReady){ addRow('poseRes','動画','未選択','ng','先に動画を選んでください'); btn.disabled=false; btn.textContent='姿勢推定を試す'; return; }

  let vision, PoseLandmarker, FilesetResolver;
  try{
    log('loading engine from CDN…');
    const t = performance.now();
    vision = await import(CDN + '/vision_bundle.mjs');
    ({PoseLandmarker, FilesetResolver} = vision);
    addRow('poseRes','解析エンジンの読み込み', `${((performance.now()-t)/1000).toFixed(1)} 秒`, 'ok');
  }catch(err){
    addRow('poseRes','解析エンジンの読み込み','失敗','ng', err.message);
    log('engine import failed: ' + err.message, true);
    btn.disabled=false; btn.textContent='もう一度試す'; return;
  }

  let landmarker, usedGpu = true;
  try{
    const t = performance.now();
    const files = await FilesetResolver.forVisionTasks(CDN + '/wasm');
    try{
      landmarker = await PoseLandmarker.createFromOptions(files, {
        baseOptions: {modelAssetPath: MODEL, delegate: 'GPU'},
        runningMode: 'VIDEO', numPoses: 1
      });
    }catch(gpuErr){
      log('GPU delegate failed, retry with CPU: ' + gpuErr.message, true);
      usedGpu = false;
      landmarker = await PoseLandmarker.createFromOptions(files, {
        baseOptions: {modelAssetPath: MODEL, delegate: 'CPU'},
        runningMode: 'VIDEO', numPoses: 1
      });
    }
    addRow('poseRes','モデルの準備', `${((performance.now()-t)/1000).toFixed(1)} 秒`, 'ok',
      usedGpu ? 'GPUで実行' : 'CPUで実行(GPUが使えませんでした)');
  }catch(err){
    addRow('poseRes','モデルの準備','失敗','ng', err.message);
    log('landmarker init failed: ' + err.message, true);
    btn.disabled=false; btn.textContent='もう一度試す'; return;
  }

  // 実測
  btn.textContent = '測定中…';
  const canvas = document.getElementById('poseCanvas');
  canvas.classList.remove('hidden');
  const scale = 480 / Math.max(video.videoWidth, video.videoHeight, 1);
  canvas.width = Math.round(video.videoWidth * Math.min(scale,1));
  canvas.height = Math.round(video.videoHeight * Math.min(scale,1));
  const ctx = canvas.getContext('2d');

  const times = [];
  let detected = 0, visSum = 0, visN = 0;
  video.currentTime = 0;
  try{ await video.play(); }catch(e){ log('play failed: ' + e.message, true); }

  const TARGET = 60;
  let ts = 0;
  await new Promise(res => {
    const step = () => {
      if(times.length >= TARGET || video.ended){ res(); return; }
      try{
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const t = performance.now();
        ts += 33;
        const r = landmarker.detectForVideo(canvas, ts);
        times.push(performance.now() - t);
        if(r && r.landmarks && r.landmarks.length){
          detected++;
          drawSkeleton(ctx, r.landmarks[0], canvas);
          for(const lm of r.landmarks[0]){
            if(typeof lm.visibility === 'number'){ visSum += lm.visibility; visN++; }
          }
        }
      }catch(e){ log('detect error: ' + e.message, true); }
      if('requestVideoFrameCallback' in HTMLVideoElement.prototype) video.requestVideoFrameCallback(step);
      else requestAnimationFrame(step);
    };
    if('requestVideoFrameCallback' in HTMLVideoElement.prototype) video.requestVideoFrameCallback(step);
    else requestAnimationFrame(step);
    setTimeout(res, 25000);
  });
  video.pause();

  if(times.length){
    const sorted = [...times].sort((a,b)=>a-b);
    const med = sorted[Math.floor(sorted.length/2)];
    const avg = times.reduce((a,b)=>a+b,0)/times.length;
    addRow('poseRes','1フレームの処理時間', `${med.toFixed(1)} ms`, med<40?'ok':med<100?'warn':'ng', `平均 ${avg.toFixed(1)} ms / ${times.length} フレーム`);
    addRow('poseRes','1秒あたりの処理量', `${(1000/med).toFixed(1)} fps相当`, 'probe');
    const sec10 = (300 * med / 1000);
    addRow('poseRes','10秒の動画にかかる時間', `約 ${sec10.toFixed(1)} 秒`, sec10<20?'ok':sec10<60?'warn':'ng', '30fpsで換算');
    addRow('poseRes','骨格を検出できた割合', `${(100*detected/times.length).toFixed(0)} %`, detected/times.length>0.8?'ok':'warn');
    if(visN) addRow('poseRes','検出の平均信頼度', (visSum/visN).toFixed(2), 'probe');
  }else{
    addRow('poseRes','測定','フレームを処理できませんでした','ng');
  }

  try{ landmarker.close(); }catch(e){}
  btn.disabled = false; btn.textContent = 'もう一度試す';
});

const BONES = [[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28],[27,31],[28,32]];
function drawSkeleton(ctx, lms, canvas){
  ctx.lineWidth = 3; ctx.strokeStyle = '#00e0a0'; ctx.fillStyle = '#ffdd33';
  for(const [a,b] of BONES){
    const p = lms[a], q = lms[b];
    if(!p || !q) continue;
    ctx.beginPath();
    ctx.moveTo(p.x*canvas.width, p.y*canvas.height);
    ctx.lineTo(q.x*canvas.width, q.y*canvas.height);
    ctx.stroke();
  }
  for(const p of lms){
    ctx.beginPath();
    ctx.arc(p.x*canvas.width, p.y*canvas.height, 3, 0, Math.PI*2);
    ctx.fill();
  }
}

log(`起動 ${VERSION}`);
</script>
