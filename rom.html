<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>肩関節の可動範囲を測る — motion-viz</title>
<style>
  :root{
    --ink:#12181b;
    --ink-2:#55646b;
    --ink-3:#93a2a9;
    --line:#d3dade;
    --paper:#f6f8f8;
    --card:#ffffff;
    --ok:#1d6f4f;
    --warn:#8a5b00;
    --ng:#a32b21;
    --probe:#1f5f8b;
    --left:#1f5f8b;
    --right:#a3562b;
  }
  *{box-sizing:border-box;-webkit-text-size-adjust:100%}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    font-size:16px; line-height:1.6;
    padding:0 16px calc(80px + env(safe-area-inset-bottom));
    max-width:760px; margin:0 auto;
  }
  .masthead{
    padding:22px 0 14px; border-bottom:2px solid var(--ink);
    display:flex; align-items:baseline; justify-content:space-between; gap:12px;
  }
  .masthead h1{font-size:18px;font-weight:600;margin:0}
  .ver{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink-2);white-space:nowrap}
  .lede{margin:14px 0 0;font-size:14px;color:var(--ink-2)}
  h2{font-size:14px;font-weight:600;margin:30px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--line)}

  .seg{display:flex;gap:0;margin-top:10px;border:1px solid var(--ink);border-radius:2px;overflow:hidden}
  .seg button{
    flex:1;padding:11px 8px;border:none;background:var(--card);color:var(--ink);
    font-family:inherit;font-size:14px;cursor:pointer;border-right:1px solid var(--line);
  }
  .seg button:last-child{border-right:none}
  .seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .seg button:focus-visible{outline:2px solid var(--probe);outline-offset:-4px}
  .seglabel{font-size:13px;color:var(--ink-2);margin-top:14px}

  .btn{
    display:block;width:100%;padding:14px 16px;margin-top:12px;
    background:var(--ink);color:#fff;border:none;border-radius:2px;
    font-size:15px;font-family:inherit;font-weight:500;cursor:pointer;
  }
  .btn.quiet{background:transparent;color:var(--ink);border:1px solid var(--ink)}
  .btn:disabled{opacity:.35}
  .btn:focus-visible{outline:2px solid var(--probe);outline-offset:2px}
  label.file{
    display:block;padding:14px 16px;margin-top:12px;border:1px dashed var(--ink-2);
    border-radius:2px;text-align:center;font-size:15px;font-weight:500;cursor:pointer;
  }
  label.file input{display:none}

  .stage{position:relative;margin-top:14px;background:#000;line-height:0}
  .stage canvas{width:100%;display:block}
  video.src{display:none}

  .scrub{width:100%;margin-top:10px;accent-color:var(--ink)}
  .timeline{
    display:flex;justify-content:space-between;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:12px;color:var(--ink-2);
  }

  #chart{width:100%;height:200px;display:block;margin-top:6px;background:var(--card);border:1px solid var(--line)}

  .prog{height:3px;background:var(--line);margin-top:12px}
  .prog i{display:block;height:100%;background:var(--ink);width:0}

  .cards{margin-top:8px}
  .card{
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--ink-3);
    padding:12px 14px;margin-top:10px;
  }
  .card.on-left{border-left-color:var(--left)}
  .card.on-right{border-left-color:var(--right)}
  .card.off{opacity:.5}
  .card h3{margin:0;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .card h3 em{font-style:normal;font-size:12px;color:var(--ink-2);font-weight:400}
  .nums{display:flex;gap:20px;margin-top:8px;flex-wrap:wrap}
  .num{min-width:64px}
  .num b{
    display:block;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
    font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;
  }
  .num span{font-size:12px;color:var(--ink-2)}
  .card p{margin:8px 0 0;font-size:12px;color:var(--ink-2)}

  .row{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line)}
  .row .k{font-size:14px}
  .row .v{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;text-align:right;color:var(--ink-2)}
  .row .v.ok{color:var(--ok)} .row .v.warn{color:var(--warn)} .row .v.ng{color:var(--ng)}

  .hist{background:var(--card);border:1px solid var(--line);padding:10px 12px;margin-top:10px;font-size:13px}
  .hist .top{display:flex;justify-content:space-between;gap:10px}
  .hist .meta{color:var(--ink-2);font-size:12px;margin-top:2px}
  .hist .vals{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--ink-2);margin-top:6px}

  .notice{border-left:3px solid var(--warn);background:#fffaf0;padding:10px 12px;margin-top:14px;font-size:13px}
  .hidden{display:none}

  #logwrap{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--ink);max-height:60vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom)}
  #logbar{display:flex;align-items:center;gap:8px;padding:9px 16px}
  #logbar span{font-size:13px;font-weight:600;flex:1}
  #logbar button{font-family:inherit;font-size:12px;padding:6px 10px;border:1px solid var(--line);background:var(--card);border-radius:2px;cursor:pointer}
  #log{display:none;overflow-y:auto;padding:0 16px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;line-height:1.5;white-space:pre-wrap;word-break:break-all;color:var(--ink-2);border-top:1px solid var(--line)}
  #log.open{display:block}
  #log .err{color:var(--ng)}
</style>
</head>
<body>

<div class="masthead">
  <h1>肩関節の可動範囲</h1>
  <div class="ver" id="ver"></div>
</div>
<p class="lede">動画から肩の角度を測り、可動範囲を記録します。撮影方向によって測れる角度が変わります。</p>

<h2>撮影条件</h2>
<div class="seglabel">カメラの向き</div>
<div class="seg" id="segView">
  <button data-v="front" aria-pressed="true">正面から</button>
  <button data-v="side" aria-pressed="false">真横から</button>
</div>
<div class="seglabel">測る側</div>
<div class="seg" id="segSide">
  <button data-s="both" aria-pressed="true">両側</button>
  <button data-s="left" aria-pressed="false">左のみ</button>
  <button data-s="right" aria-pressed="false">右のみ</button>
</div>
<div class="seglabel">被検者ID(任意)</div>
<input id="subjectId" type="text" inputmode="latin" placeholder="例: ID0042"
  style="width:100%;padding:11px 12px;margin-top:10px;border:1px solid var(--line);border-radius:2px;font-family:inherit;font-size:15px;background:var(--card)">

<h2>動画</h2>
<label class="file">動画を選ぶ<input type="file" accept="video/*" id="videoInput"></label>
<video class="src" id="video" playsinline muted preload="auto"></video>
<button class="btn" id="analyze" disabled>解析する</button>
<div class="prog hidden" id="prog"><i></i></div>
<div id="status"></div>

<div id="resultArea" class="hidden">
  <h2>再生と角度</h2>
  <div class="stage"><canvas id="stage"></canvas></div>
  <input type="range" class="scrub" id="scrub" min="0" max="0" value="0" step="1">
  <div class="timeline"><span id="tNow">0.00 s</span><span id="tEnd">0.00 s</span></div>
  <canvas id="chart"></canvas>

  <h2>結果</h2>
  <div class="cards" id="cards"></div>
  <div class="notice">
    ここでの角度は、体幹に対する上腕の角度です。日本整形外科学会の関節可動域測定法とは定義が異なります。参考値としてご利用ください。
  </div>

  <h2>解析の品質</h2>
  <div id="quality"></div>

  <h2>書き出し</h2>
  <button class="btn quiet" id="exportCsv">CSVを書き出す</button>
  <button class="btn quiet" id="saveRec">この結果を履歴に保存</button>
</div>

<h2>履歴</h2>
<div id="history"></div>
<button class="btn quiet" id="exportAll">履歴をまとめて書き出す</button>

<div id="logwrap">
  <div id="logbar">
    <span id="logTitle">ログ (0)</span>
    <button id="copyLog" type="button">コピー</button>
    <button id="toggleLog" type="button">開く</button>
  </div>
  <div id="log"></div>
</div>

<script type="module">
/* =========================================================================
   motion-viz / 肩関節ROM 最小版
   構成:
     [1] 設定・ログ
     [2] 角度定義テーブル(外部化。関節追加はここだけ)
     [3] 中間データ形式(スキーマ固定)
     [4] 姿勢推定エンジン(差し替え可能な境界)
     [5] 解析パイプライン: 平滑化 → 外れ値除去 → 指標算出
     [6] 表示
     [7] CSV / 履歴
   ========================================================================= */

/* ---------- [1] 設定 ---------- */
const APP_VERSION = 'v0.2';
const SCHEMA_VERSION = 1;
const CFG = {
  procWidth: 640,          // 解析時の縮小幅(1080pのままだと遅いため)
  visMin: 0.5,             // これ未満の信頼度は不採用
  maxDegPerFrame: 15,      // 1フレームの変化がこれを超えたら飛びとみなす
  medianWin: 5,            // 中央値フィルタ窓
  smoothWin: 7,            // 移動平均窓
  pct: 95,                 // 最大値の代わりに使うパーセンタイル
  holdSec: 0.2,            // この時間以上保持していないと採用しない
  minValidRatio: 0.5       // 有効フレームがこれ未満なら測定不可扱い
};
document.getElementById('ver').textContent = APP_VERSION;

const logEl = document.getElementById('log');
const logTitle = document.getElementById('logTitle');
const logLines = [];
function log(m, isErr){
  const line = `[${new Date().toISOString().slice(11,23)}] ${m}`;
  logLines.push(line);
  const d = document.createElement('div');
  if(isErr) d.className='err';
  d.textContent = line; logEl.appendChild(d);
  logEl.scrollTop = logEl.scrollHeight;
  logTitle.textContent = `ログ (${logLines.length})`;
}
window.addEventListener('error', e => log('ERROR: '+e.message+' @'+e.lineno, true));
window.addEventListener('unhandledrejection', e => log('REJECT: '+(e.reason?.message||e.reason), true));
document.getElementById('toggleLog').onclick = e => {
  const open = logEl.classList.toggle('open'); e.target.textContent = open ? '閉じる' : '開く';
};
document.getElementById('copyLog').onclick = async e => {
  try{ await navigator.clipboard.writeText([`--- ${APP_VERSION} ---`,...logLines].join('\n')); e.target.textContent='コピーしました'; }
  catch(err){ e.target.textContent='コピー不可'; }
  setTimeout(()=>e.target.textContent='コピー',1600);
};

/* ---------- [2] 角度定義テーブル ---------- */
// コードを触らずに関節を増やせるよう、定義をデータとして持つ。
// type 'three' : a-b-c の3点がなす角
// vs           : b→c ベクトルと基準(体幹軸/鉛直)のなす角
const LM = {
  L_SH:11, R_SH:12, L_EL:13, R_EL:14, L_WR:15, R_WR:16,
  L_HIP:23, R_HIP:24, L_KN:25, R_KN:26, L_AN:27, R_AN:28
};
const ANGLE_DEFS = [
  { id:'sh_abd_L', label:'肩 外転', side:'left',  views:['front'],
    type:'trunkVec', shoulder:LM.L_SH, elbow:LM.L_EL, hip:LM.L_HIP,
    desc:'体幹軸に対して上腕が横に開いた角度' },
  { id:'sh_abd_R', label:'肩 外転', side:'right', views:['front'],
    type:'trunkVec', shoulder:LM.R_SH, elbow:LM.R_EL, hip:LM.R_HIP,
    desc:'体幹軸に対して上腕が横に開いた角度' },
  { id:'sh_flex_L', label:'肩 屈曲・伸展', side:'left', views:['side'],
    type:'trunkVec', shoulder:LM.L_SH, elbow:LM.L_EL, hip:LM.L_HIP,
    desc:'体幹軸に対して上腕が前後に動いた角度' },
  { id:'sh_flex_R', label:'肩 屈曲・伸展', side:'right', views:['side'],
    type:'trunkVec', shoulder:LM.R_SH, elbow:LM.R_EL, hip:LM.R_HIP,
    desc:'体幹軸に対して上腕が前後に動いた角度' },
  { id:'el_flex_L', label:'肘 屈曲', side:'left', views:['front','side'],
    type:'three', a:LM.L_SH, b:LM.L_EL, c:LM.L_WR,
    desc:'肩-肘-手首がなす角' },
  { id:'el_flex_R', label:'肘 屈曲', side:'right', views:['front','side'],
    type:'three', a:LM.R_SH, b:LM.R_EL, c:LM.R_WR,
    desc:'肩-肘-手首がなす角' },
  // 2Dでは取得できないもの(常にグレーアウト表示して理由を示す)
  { id:'sh_rot_L', label:'肩 内旋・外旋', side:'left',  views:[], unavailable:'2Dカメラでは回旋を測れません' },
  { id:'sh_rot_R', label:'肩 内旋・外旋', side:'right', views:[], unavailable:'2Dカメラでは回旋を測れません' }
];

/* ---------- [3] 中間データ形式 ---------- */
// { schema, app, createdAt, video:{name,w,h,duration,fps}, frames:[{i,t,lm:[{x,y,z,v}...]}] }
let SESSION = null;   // 中間データ
let SERIES  = null;   // 解析後の角度時系列
let METRICS = null;   // 指標

/* ---------- [4] 姿勢推定エンジン ---------- */
const ENGINE = {
  cdn: 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14',
  model: 'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
  inst: null,
  async load(){
    if(this.inst) return this.inst;
    const t0 = performance.now();
    const vision = await import(this.cdn + '/vision_bundle.mjs');
    const files = await vision.FilesetResolver.forVisionTasks(this.cdn + '/wasm');
    let lm;
    try{
      lm = await vision.PoseLandmarker.createFromOptions(files, {
        baseOptions:{modelAssetPath:this.model, delegate:'GPU'},
        runningMode:'VIDEO', numPoses:1
      });
    }catch(e){
      log('GPU不可のためCPUで実行: '+e.message, true);
      lm = await vision.PoseLandmarker.createFromOptions(files, {
        baseOptions:{modelAssetPath:this.model, delegate:'CPU'},
        runningMode:'VIDEO', numPoses:1
      });
    }
    log(`エンジン準備 ${(performance.now()-t0).toFixed(0)}ms`);
    this.inst = lm; return lm;
  }
};

/* ---------- 状態 ---------- */
let view = 'front', side = 'both';
const segView = document.getElementById('segView');
const segSide = document.getElementById('segSide');
segView.onclick = e => { const b=e.target.closest('button'); if(!b) return;
  [...segView.children].forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  view = b.dataset.v; if(METRICS) renderCards(); };
segSide.onclick = e => { const b=e.target.closest('button'); if(!b) return;
  [...segSide.children].forEach(x=>x.setAttribute('aria-pressed', String(x===b)));
  side = b.dataset.s; if(METRICS) renderCards(); };

const video = document.getElementById('video');
let videoFile = null;

document.getElementById('videoInput').onchange = async e => {
  const f = e.target.files?.[0]; if(!f) return;
  videoFile = f;
  document.getElementById('resultArea').classList.add('hidden');
  SESSION = SERIES = METRICS = null;
  video.src = URL.createObjectURL(f);
  try{
    await new Promise((res,rej)=>{
      video.onloadedmetadata = res;
      video.onerror = ()=>rej(new Error('この動画を読み込めません'));
      setTimeout(()=>rej(new Error('読み込みタイムアウト')), 15000);
    });
  }catch(err){ setStatus(err.message,'ng'); log(err.message,true); return; }
  setStatus(`${f.name} / ${video.videoWidth}×${video.videoHeight} / ${video.duration.toFixed(1)}秒`,'probe');
  document.getElementById('analyze').disabled = false;
};

function setStatus(msg, state){
  const el = document.getElementById('status');
  el.innerHTML = '';
  const r = document.createElement('div'); r.className='row';
  const k=document.createElement('div'); k.className='k'; k.textContent='状態';
  const v=document.createElement('div'); v.className='v'+(state?' '+state:''); v.textContent=msg;
  r.append(k,v); el.append(r); log('状態: '+msg);
}

/* ---------- 解析実行 ---------- */
document.getElementById('analyze').onclick = async () => {
  const btn = document.getElementById('analyze');
  btn.disabled = true; btn.textContent = '解析中…';
  const prog = document.getElementById('prog');
  prog.classList.remove('hidden'); prog.firstElementChild.style.width='0%';
  try{
    setStatus('解析エンジンを準備しています','probe');
    const lm = await ENGINE.load();
    setStatus('骨格を検出しています','probe');
    SESSION = await extractLandmarks(video, lm, p => {
      prog.firstElementChild.style.width = (p*100).toFixed(1)+'%';
    });
    log(`抽出 ${SESSION.frames.length} フレーム / 推定fps ${SESSION.video.fps.toFixed(1)}`);
    SERIES = buildSeries(SESSION);
    METRICS = computeMetrics(SERIES, SESSION);
    document.getElementById('resultArea').classList.remove('hidden');
    setupPlayback();
    renderCards(); renderQuality();
    setStatus('解析が完了しました','ok');
  }catch(err){
    setStatus('解析に失敗しました: '+err.message,'ng');
    log('analyze failed: '+err.message, true);
  }finally{
    prog.classList.add('hidden');
    btn.disabled=false; btn.textContent='解析する';
  }
};

/* シークして1枚ずつ確実に処理する(再生同期だと取りこぼすため) */
async function extractLandmarks(v, lm, onProgress){
  const scale = CFG.procWidth / v.videoWidth;
  const w = Math.round(v.videoWidth * Math.min(scale,1));
  const h = Math.round(v.videoHeight * Math.min(scale,1));
  const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
  const ctx = cv.getContext('2d', {willReadFrequently:false});

  const fps = 30;
  const dt = 1/fps;
  const total = Math.max(1, Math.floor(v.duration / dt));
  const frames = [];
  v.pause();

  for(let i=0; i<total; i++){
    const t = i*dt;
    await seekTo(v, t);
    ctx.drawImage(v, 0, 0, w, h);
    let lms = null;
    try{
      const r = lm.detectForVideo(cv, Math.round(t*1000));
      if(r?.landmarks?.length) lms = pickSubject(r.landmarks);
    }catch(e){ log('detect: '+e.message, true); }
    frames.push({
      i, t,
      lm: lms ? lms.map(p=>({x:+p.x.toFixed(4), y:+p.y.toFixed(4), z:+p.z.toFixed(4), v:+(p.visibility??0).toFixed(3)})) : null
    });
    if(i % 5 === 0) onProgress(i/total);
    if(i % 10 === 0) await new Promise(r=>setTimeout(r,0)); // UIを固まらせない
  }
  onProgress(1);
  return {
    schema: SCHEMA_VERSION, app: APP_VERSION, createdAt: new Date().toISOString(),
    video:{ name: videoFile?.name||'', w:v.videoWidth, h:v.videoHeight, duration:v.duration, fps },
    frames
  };
}
function seekTo(v, t){
  return new Promise(res=>{
    const done = ()=>{ v.removeEventListener('seeked', done); res(); };
    v.addEventListener('seeked', done);
    v.currentTime = Math.min(t, Math.max(0, v.duration - 0.01));
    setTimeout(res, 400);
  });
}
// 背景に人が写り込む前提で、画面中央に近く大きい人物を選ぶ
function pickSubject(list){
  if(list.length === 1) return list[0];
  let best=null, bestScore=-Infinity;
  for(const p of list){
    const xs=p.map(q=>q.x), ys=p.map(q=>q.y);
    const cx=(Math.min(...xs)+Math.max(...xs))/2;
    const area=(Math.max(...xs)-Math.min(...xs))*(Math.max(...ys)-Math.min(...ys));
    const score = area - Math.abs(cx-0.5)*0.5;
    if(score>bestScore){ bestScore=score; best=p; }
  }
  return best;
}

/* ---------- [5] 角度計算と後処理 ---------- */
function angleThree(a,b,c){
  const v1={x:a.x-b.x,y:a.y-b.y}, v2={x:c.x-b.x,y:c.y-b.y};
  const d=v1.x*v2.x+v1.y*v2.y;
  const m=Math.hypot(v1.x,v1.y)*Math.hypot(v2.x,v2.y);
  if(m===0) return null;
  return Math.acos(Math.max(-1,Math.min(1,d/m)))*180/Math.PI;
}
// 体幹軸(肩→股関節)に対する上腕(肩→肘)の角度。下垂位を0度とする
function angleTrunk(sh, el, hip){
  const trunk={x:hip.x-sh.x, y:hip.y-sh.y};
  const arm={x:el.x-sh.x, y:el.y-sh.y};
  const mt=Math.hypot(trunk.x,trunk.y), ma=Math.hypot(arm.x,arm.y);
  if(mt===0||ma===0) return null;
  const d=(trunk.x*arm.x+trunk.y*arm.y)/(mt*ma);
  return Math.acos(Math.max(-1,Math.min(1,d)))*180/Math.PI;
}

function buildSeries(sess){
  const out = {};
  for(const def of ANGLE_DEFS){
    if(def.unavailable){ out[def.id]={def, raw:[], val:[], valid:[]}; continue; }
    const raw = [], vis = [];
    for(const f of sess.frames){
      if(!f.lm){ raw.push(null); vis.push(0); continue; }
      let ang=null, v=0;
      try{
        if(def.type==='three'){
          const a=f.lm[def.a], b=f.lm[def.b], c=f.lm[def.c];
          ang = angleThree(a,b,c); v = Math.min(a.v,b.v,c.v);
        }else{
          const s=f.lm[def.shoulder], e=f.lm[def.elbow], hp=f.lm[def.hip];
          ang = angleTrunk(s,e,hp); v = Math.min(s.v,e.v,hp.v);
        }
      }catch(err){}
      raw.push(ang); vis.push(v);
    }
    out[def.id] = { def, raw, vis, ...postProcess(raw, vis, sess.video.fps) };
  }
  return out;
}

function postProcess(raw, vis, fps){
  const n = raw.length;
  // 1) 信頼度で除外
  let a = raw.map((x,i)=> (x!=null && vis[i]>=CFG.visMin) ? x : null);
  // 2) ありえない急変を除外
  let prev=null;
  a = a.map(x=>{
    if(x==null){ return null; }
    if(prev!=null && Math.abs(x-prev)>CFG.maxDegPerFrame){ return null; }
    prev=x; return x;
  });
  // 3) 中央値フィルタ → 移動平均
  const med = medianFilter(a, CFG.medianWin);
  const val = movingAvg(med, CFG.smoothWin);
  // 4) 有効フラグ
  const valid = val.map(x=>x!=null);
  return { val, valid, validRatio: valid.filter(Boolean).length / Math.max(1,n) };
}
function medianFilter(arr, w){
  const half=Math.floor(w/2);
  return arr.map((_,i)=>{
    const win=[];
    for(let j=i-half;j<=i+half;j++) if(arr[j]!=null) win.push(arr[j]);
    if(!win.length) return null;
    win.sort((x,y)=>x-y);
    return win[Math.floor(win.length/2)];
  });
}
function movingAvg(arr, w){
  const half=Math.floor(w/2);
  return arr.map((_,i)=>{
    let s=0,c=0;
    for(let j=i-half;j<=i+half;j++) if(arr[j]!=null){ s+=arr[j]; c++; }
    return c ? s/c : null;
  });
}
function percentile(sorted, p){
  if(!sorted.length) return null;
  const idx=(sorted.length-1)*p/100;
  const lo=Math.floor(idx), hi=Math.ceil(idx);
  return lo===hi ? sorted[lo] : sorted[lo]+(sorted[hi]-sorted[lo])*(idx-lo);
}
// 「その角度を holdSec 以上保持したか」を満たす最大値
function heldExtreme(vals, fps, dir){
  const need = Math.max(1, Math.round(CFG.holdSec*fps));
  const clean = vals.filter(v=>v!=null);
  if(clean.length < need) return null;
  const sorted=[...clean].sort((a,b)=>a-b);
  const cand = dir==='max' ? percentile(sorted, CFG.pct) : percentile(sorted, 100-CFG.pct);
  // 候補値の近傍に need フレーム以上あるか確認
  const tol = 5;
  const cnt = clean.filter(v=>Math.abs(v-cand)<=tol).length;
  return cnt>=need ? cand : cand; // 満たさなくても値は返し、品質側で警告する
}

function computeMetrics(series, sess){
  const fps = sess.video.fps, out = {};
  for(const id in series){
    const s = series[id];
    if(s.def.unavailable){ out[id]={unavailable:s.def.unavailable}; continue; }
    const vals = s.val;
    const clean = vals.filter(v=>v!=null);
    if(!clean.length || s.validRatio < CFG.minValidRatio){
      out[id] = { insufficient:true, validRatio:s.validRatio||0, n:clean.length };
      continue;
    }
    const sorted=[...clean].sort((a,b)=>a-b);
    const max = heldExtreme(vals, fps, 'max');
    const min = heldExtreme(vals, fps, 'min');
    const meanVis = s.vis ? s.vis.reduce((a,b)=>a+b,0)/s.vis.length : 0;
    out[id] = {
      max, min, range: (max!=null&&min!=null)? max-min : null,
      absMax: sorted[sorted.length-1], absMin: sorted[0],
      n: clean.length, total: vals.length,
      validRatio: s.validRatio, meanVis
    };
  }
  return out;
}

/* ---------- [6] 表示 ---------- */
function activeDefs(){
  return ANGLE_DEFS.filter(d=>{
    if(side!=='both' && d.side!==side) return false;
    return true;
  });
}
function isMeasurable(def){
  if(def.unavailable) return false;
  return def.views.includes(view);
}

function renderCards(){
  const box=document.getElementById('cards'); box.innerHTML='';
  for(const def of activeDefs()){
    const m = METRICS?.[def.id];
    const card=document.createElement('div');
    card.className='card ' + (def.side==='left'?'on-left':'on-right');
    const measurable = isMeasurable(def);
    if(!measurable || !m || m.insufficient || m.unavailable) card.classList.add('off');

    const h=document.createElement('h3');
    h.innerHTML = `<span>${def.label} <em>${def.side==='left'?'左':'右'}</em></span>`;
    card.append(h);

    if(def.unavailable){
      card.insertAdjacentHTML('beforeend', `<p>${def.unavailable}</p>`);
    }else if(!measurable){
      const need = def.views.map(v=>v==='front'?'正面':'真横').join('・');
      card.insertAdjacentHTML('beforeend', `<p>この向きでは測れません。${need}から撮影してください。</p>`);
    }else if(!m || m.insufficient){
      card.insertAdjacentHTML('beforeend',
        `<p>検出が不足しています(有効フレーム ${(100*(m?.validRatio||0)).toFixed(0)}%)。全身が写るように撮り直してください。</p>`);
    }else{
      const nums=document.createElement('div'); nums.className='nums';
      nums.innerHTML =
        `<div class="num"><b>${m.max.toFixed(0)}°</b><span>最大</span></div>
         <div class="num"><b>${m.min.toFixed(0)}°</b><span>最小</span></div>
         <div class="num"><b>${m.range.toFixed(0)}°</b><span>可動範囲</span></div>`;
      card.append(nums);
      card.insertAdjacentHTML('beforeend',
        `<p>${def.desc} / 採用 ${m.n}/${m.total} フレーム・平均信頼度 ${m.meanVis.toFixed(2)}</p>`);
    }
    box.append(card);
  }
  drawChart();
}

function renderQuality(){
  const q=document.getElementById('quality'); q.innerHTML='';
  const det = SESSION.frames.filter(f=>f.lm).length;
  const ratio = det/SESSION.frames.length;
  addRow(q,'解析フレーム数', `${SESSION.frames.length}`);
  addRow(q,'骨格を検出できた割合', `${(100*ratio).toFixed(0)} %`, ratio>0.9?'ok':ratio>0.7?'warn':'ng');
  addRow(q,'解析解像度', `${CFG.procWidth}px幅に縮小`);
  addRow(q,'平滑化', `中央値${CFG.medianWin} → 移動平均${CFG.smoothWin}`);
  addRow(q,'最大値の求め方', `${CFG.pct}パーセンタイル`);
}
function addRow(el,k,v,state){
  const r=document.createElement('div'); r.className='row';
  r.innerHTML=`<div class="k"></div><div class="v${state?' '+state:''}"></div>`;
  r.children[0].textContent=k; r.children[1].textContent=v; el.append(r);
}

/* 再生とグラフの同期 */
const stage=document.getElementById('stage');
const sctx=stage.getContext('2d');
const scrub=document.getElementById('scrub');
let curFrame=0;

function setupPlayback(){
  const w = Math.min(720, video.videoWidth);
  stage.width = w; stage.height = Math.round(video.videoHeight * w/video.videoWidth);
  scrub.max = SESSION.frames.length-1; scrub.value=0;
  document.getElementById('tEnd').textContent = SESSION.video.duration.toFixed(2)+' s';
  scrub.oninput = () => showFrame(+scrub.value);
  showFrame(0);
}
async function showFrame(i){
  curFrame=i;
  const f=SESSION.frames[i]; if(!f) return;
  document.getElementById('tNow').textContent = f.t.toFixed(2)+' s';
  await seekTo(video, f.t);
  sctx.drawImage(video,0,0,stage.width,stage.height);
  if(f.lm) drawSkeleton(sctx, f.lm, stage);
  drawChart();
}
const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function drawSkeleton(ctx,lms,cv){
  ctx.lineWidth=Math.max(2,cv.width/240);
  for(const [a,b] of BONES){
    const p=lms[a],q=lms[b]; if(!p||!q) continue;
    const weak = Math.min(p.v,q.v) < CFG.visMin;
    ctx.strokeStyle = weak ? 'rgba(160,160,160,.6)' : '#19d59a';
    ctx.beginPath(); ctx.moveTo(p.x*cv.width,p.y*cv.height); ctx.lineTo(q.x*cv.width,q.y*cv.height); ctx.stroke();
  }
  for(const p of lms){
    ctx.fillStyle = p.v<CFG.visMin ? 'rgba(160,160,160,.6)' : '#ffd83d';
    ctx.beginPath(); ctx.arc(p.x*cv.width,p.y*cv.height,Math.max(2,cv.width/300),0,Math.PI*2); ctx.fill();
  }
}

const chart=document.getElementById('chart');
function drawChart(){
  if(!SERIES) return;
  const dpr=window.devicePixelRatio||1;
  const W=chart.clientWidth, H=200;
  chart.width=W*dpr; chart.height=H*dpr;
  const c=chart.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,W,H);
  const pad={l:34,r:8,t:10,b:18};
  const plot={x:pad.l,y:pad.t,w:W-pad.l-pad.r,h:H-pad.t-pad.b};

  const shown = activeDefs().filter(d=>isMeasurable(d) && METRICS?.[d.id] && !METRICS[d.id].insufficient);
  if(!shown.length){
    c.fillStyle='#93a2a9'; c.font='13px -apple-system,sans-serif'; c.textAlign='center';
    c.fillText('表示できる角度がありません', W/2, H/2); return;
  }
  let lo=Infinity, hi=-Infinity;
  for(const d of shown){ const m=METRICS[d.id]; lo=Math.min(lo,m.absMin); hi=Math.max(hi,m.absMax); }
  lo=Math.floor((lo-5)/10)*10; hi=Math.ceil((hi+5)/10)*10;
  const X=i=>plot.x+plot.w*i/Math.max(1,SESSION.frames.length-1);
  const Y=v=>plot.y+plot.h*(1-(v-lo)/Math.max(1,hi-lo));

  c.strokeStyle='#e3e9eb'; c.fillStyle='#93a2a9'; c.font='10px ui-monospace,monospace'; c.textAlign='right';
  for(let g=lo; g<=hi; g+=Math.max(10,Math.round((hi-lo)/4/10)*10)){
    c.beginPath(); c.moveTo(plot.x,Y(g)); c.lineTo(plot.x+plot.w,Y(g)); c.stroke();
    c.fillText(g+'°', plot.x-5, Y(g)+3);
  }
  // 低信頼度区間
  for(const d of shown){
    const s=SERIES[d.id];
    c.fillStyle='rgba(147,162,169,.16)';
    for(let i=0;i<s.valid.length;i++) if(!s.valid[i]) c.fillRect(X(i),plot.y,Math.max(1,plot.w/s.valid.length),plot.h);
  }
  // 曲線
  for(const d of shown){
    const s=SERIES[d.id];
    c.strokeStyle = d.side==='left' ? '#1f5f8b' : '#a3562b';
    c.lineWidth=2; c.beginPath();
    let started=false;
    s.val.forEach((v,i)=>{
      if(v==null){ started=false; return; }
      if(!started){ c.moveTo(X(i),Y(v)); started=true; } else c.lineTo(X(i),Y(v));
    });
    c.stroke();
  }
  // 現在位置
  c.strokeStyle='#12181b'; c.lineWidth=1; c.beginPath();
  c.moveTo(X(curFrame),plot.y); c.lineTo(X(curFrame),plot.y+plot.h); c.stroke();
}
window.addEventListener('resize', ()=>drawChart());

/* ---------- [7] CSV / 履歴 ---------- */
function meta(){
  return {
    measurementId: makeId(),
    schemaVersion: SCHEMA_VERSION,
    appVersion: APP_VERSION,
    measuredAt: new Date().toISOString(),
    subjectId: document.getElementById('subjectId').value.trim() || '',
    mode: 'rom_shoulder',
    view, side,
    videoFile: SESSION?.video.name || '',
    fps: SESSION?.video.fps || null,
    resolution: SESSION ? `${SESSION.video.w}x${SESSION.video.h}` : '',
    procWidth: CFG.procWidth,
    visMin: CFG.visMin, medianWin: CFG.medianWin, smoothWin: CFG.smoothWin, pct: CFG.pct
  };
}
function makeId(){
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
}
function download(name, text){
  const blob=new Blob(['\uFEFF'+text],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.append(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  log('書き出し: '+name);
}
document.getElementById('exportCsv').onclick = () => {
  if(!SERIES) return;
  const m=meta();
  const head = Object.entries(m).map(([k,v])=>`# ${k},${v}`).join('\n');
  const rows = ['measurement_id,frame,time_sec,joint_id,joint,side,angle_deg,valid,visibility'];
  for(const id in SERIES){
    const s=SERIES[id]; if(s.def.unavailable) continue;
    if(side!=='both' && s.def.side!==side) continue;
    if(!isMeasurable(s.def)) continue;
    s.val.forEach((v,i)=>{
      rows.push([m.measurementId, i, SESSION.frames[i].t.toFixed(3), id, s.def.label, s.def.side,
        v==null?'':v.toFixed(2), s.valid[i]?1:0, s.vis?.[i]?.toFixed(3) ?? ''].join(','));
    });
  }
  download(`${m.measurementId}_${m.subjectId||'noid'}_shoulder.csv`, head+'\n'+rows.join('\n'));
};

const HIST_KEY='mv_records';
function loadRecords(){ try{ return JSON.parse(localStorage.getItem(HIST_KEY)||'[]'); }catch(e){ return []; } }
function saveRecords(r){ localStorage.setItem(HIST_KEY, JSON.stringify(r)); }

document.getElementById('saveRec').onclick = () => {
  if(!METRICS) return;
  const m=meta(); const vals={};
  for(const d of activeDefs()){
    if(!isMeasurable(d)) continue;
    const x=METRICS[d.id]; if(!x || x.insufficient || x.unavailable) continue;
    vals[d.id]={label:d.label, side:d.side, max:+x.max.toFixed(1), min:+x.min.toFixed(1), range:+x.range.toFixed(1), meanVis:+x.meanVis.toFixed(2)};
  }
  const recs=loadRecords(); recs.unshift({...m, values:vals}); saveRecords(recs);
  renderHistory();
  const b=document.getElementById('saveRec'); b.textContent='保存しました';
  setTimeout(()=>b.textContent='この結果を履歴に保存',1600);
};

function renderHistory(){
  const el=document.getElementById('history'); el.innerHTML='';
  const recs=loadRecords();
  if(!recs.length){ el.innerHTML='<p class="lede">まだ保存された測定はありません。</p>'; return; }
  for(const r of recs.slice(0,20)){
    const d=document.createElement('div'); d.className='hist';
    const vals=Object.values(r.values||{}).map(v=>`${v.label}(${v.side==='left'?'左':'右'}) ${v.max}°/${v.range}°`).join('  ');
    d.innerHTML=`<div class="top"><b>${r.subjectId||'ID未入力'}</b><span style="color:var(--ink-2);font-size:12px">${new Date(r.measuredAt).toLocaleString('ja-JP')}</span></div>
      <div class="meta">${r.view==='front'?'正面':'真横'} / ${r.side==='both'?'両側':r.side==='left'?'左':'右'} / ${r.measurementId}</div>
      <div class="vals">${vals||'記録された角度なし'}</div>`;
    el.append(d);
  }
}
document.getElementById('exportAll').onclick = () => {
  const recs=loadRecords();
  if(!recs.length){ log('履歴なし'); return; }
  const rows=['measurement_id,measured_at,subject_id,view,side,joint_id,joint,joint_side,max_deg,min_deg,range_deg,mean_visibility,app_version'];
  for(const r of recs){
    for(const id in (r.values||{})){
      const v=r.values[id];
      rows.push([r.measurementId,r.measuredAt,r.subjectId,r.view,r.side,id,v.label,v.side,v.max,v.min,v.range,v.meanVis,r.appVersion].join(','));
    }
  }
  download(`motionviz_history_${makeId()}.csv`, rows.join('\n'));
};

renderHistory();
log(`起動 ${APP_VERSION}`);
</script>
